# Netlify configuration for Chaos Zero Team Builder

[build]
  # No build process needed - static HTML/CSS/JS
  publish = "."

[[headers]]
  # Apply these headers to all routes
  for = "/*"
  [headers.values]
    # Security headers
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"

    # Cache static assets for 1 year
    Cache-Control = "public, max-age=31536000"

[[headers]]
  # Don't cache HTML to ensure updates are seen immediately
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  # Short cache for JSON data
  for = "/*.json"
  [headers.values]
    Cache-Control = "public, max-age=3600"

# Redirect rules (if needed in the future)
[[redirects]]
  from = "/index"
  to = "/"
  status = 301

# Custom 404 page (optional - would redirect to home)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
